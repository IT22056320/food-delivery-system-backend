apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: pastadudde/food-delivery-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: http://localhost:5001/api
              value: "http://food-delivery.system.com/api"
          envFrom:
            - secretRef:
                name: frontend-secrets