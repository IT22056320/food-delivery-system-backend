version: '3'

services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/Authentication?retryWrites=true&w=majority&appName=Auth
      - JWT_SECRET=your_jwt_secret_here
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
      - PORT=5000
      - GOOGLE_CLIENT_ID=your_google_client_id_here
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here
    networks:
      - food-delivery-network

  restaurant-service:
    build: ./services/restaurant-service
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=your_jwt_secret_here
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
      - PORT=5001
      - GOOGLE_CLIENT_ID=your_google_client_id_here
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here
      - CLOUDINARY_CLOUD_NAME=your_cloudinary_cloud_name
      - CLOUDINARY_API_KEY=your_cloudinary_api_key
      - CLOUDINARY_API_SECRET=your_cloudinary_api_secret
    networks:
      - food-delivery-network
    depends_on:
      - auth-service

  order-service:
    build: ./services/order-service
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - PORT=5002
      - JWT_SECRET=your_jwt_secret_here
      - STRIPE_SECRET_KEY=your_stripe_secret_key_here
      - STRIPE_WEBHOOK_SECRET=your_stripe_webhook_secret_here
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
    networks:
      - food-delivery-network
    depends_on:
      - restaurant-service

  delivery-service:
    build: ./services/delivery-service
    ports:
      - "5003:5003"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=your_jwt_secret_here
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
      - PORT=5003
      - GOOGLE_CLIENT_ID=your_google_client_id_here
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here
      - ORDER_SERVICE_URL=http://order-service:5002/api/orders
    networks:
      - food-delivery-network
    depends_on:
      - order-service

  notification-service:
    build: ./services/notification-service
    ports:
      - "5004:5004"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/Notifications?retryWrites=true&w=majority&appName=Auth
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
      - TEXTBELT_KEY=textbelt
      - TWILIO_ACCOUNT_SID=your_twilio_account_sid_here
      - TWILIO_AUTH_TOKEN=your_twilio_auth_token_here
      - TWILIO_PHONE_NUMBER=+1234567890
      - PORT=5004
    networks:
      - food-delivery-network
    depends_on:
      - auth-service

  payment-service:
    build: ./services/payment-service
    ports:
      - "5005:5005"
    environment:
      - MONGO_URI=mongodb+srv://your_username:your_password@your_cluster.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - PORT=5005
      - JWT_SECRET=your_jwt_secret_here
      - STRIPE_SECRET_KEY=your_stripe_secret_key_here
      - STRIPE_WEBHOOK_SECRET=your_stripe_webhook_secret_here
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password_here
    networks:
      - food-delivery-network
    depends_on:
      - order-service

  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=your_stripe_publishable_key_here
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=your_google_maps_api_key_here
    networks:
      - food-delivery-network
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - delivery-service
      - notification-service
      - payment-service

networks:
  food-delivery-network:
    driver: bridge