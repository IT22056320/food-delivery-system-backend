apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-container
          image: pastadudde/food-delivery-payment-service:latest
          ports:
            - containerPort: 5005
          envFrom:
            - secretRef:
                name: payment-secrets