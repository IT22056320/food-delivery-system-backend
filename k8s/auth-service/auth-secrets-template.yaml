# k8s/delivery-service/delivery-secrets-template.yaml
apiVersion: v1
kind: Secret
metadata:
  name: delivery-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://your_username:your_password@your_cluster.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0"
  JWT_SECRET: "your_jwt_secret_here"
  EMAIL_USER: "your_email@gmail.com"
  EMAIL_PASS: "your_app_password_here"
  PORT: "5003"
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret_here"
  ORDER_SERVICE_URL: "http://order-service:5002/api/orders"